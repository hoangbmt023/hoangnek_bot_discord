name: CD - cPanel Auto Deploy (Native npm install on server)

on:
  push:
    branches:
      - main
      - test/cd-deploy
  workflow_dispatch:

jobs:
  # Bước 1: Kiểm thử cú pháp mã nguồn
  ci_verification:
    name: 🧪 Verify CI Checks
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: 📦 Install Dependencies (CI Test)
        run: npm ci

      - name: 🧪 Run Tests & Syntax Validation
        run: npm test

  # Bước 2: Kích hoạt cPanel tự động kéo code và tự chạy npm install trên hosting
  deploy_cpanel_uapi:
    name: 🚀 cPanel Auto-Deploy & Native npm install
    needs: ci_verification
    runs-on: ubuntu-latest

    steps:
      - name: 🌐 Trigger cPanel to Pull Code & Run npm install via .cpanel.yml
        run: |
          CPANEL_HOST="${{ secrets.CPANEL_HOST || secrets.CPANEL_SSH_HOST || 'gienphim.site' }}"
          CPANEL_USER="${{ secrets.CPANEL_USERNAME || secrets.CPANEL_SSH_USER || 'rccwxhmh' }}"
          API_TOKEN="${{ secrets.CPANEL_API_TOKEN }}"
          REPO_PATH="${{ secrets.CPANEL_REPO_PATH || '/home/rccwxhmh/repositories/hoangnek_bot_discord' }}"
          BRANCH="${{ github.ref_name }}"

          if [ -z "$API_TOKEN" ]; then
            echo "❌ LỖI: Chưa cấu hình CPANEL_API_TOKEN trong GitHub Secrets!"
            exit 1
          fi

          echo "🚀 [CI/CD] Đang kết nối tới cPanel UAPI (https://$CPANEL_HOST:2083)..."
          echo "📁 Thư mục Git trên cPanel: $REPO_PATH"
          echo "🌿 Nhánh đồng bộ: $BRANCH"

          # 1. Gọi cPanel UAPI để cập nhật (git pull) từ nhánh hiện tại
          echo "📥 [1/2] Yêu cầu cPanel kéo code mới nhất từ GitHub..."
          UPDATE_RES=$(curl -s -k -H "Authorization: cpanel $CPANEL_USER:$API_TOKEN" \
            "https://$CPANEL_HOST:2083/execute/VersionControl/update?repository_root=$REPO_PATH&branch=$BRANCH")
          
          echo "Phản hồi từ cPanel Update:"
          echo "$UPDATE_RES"

          # 2. Gọi cPanel UAPI để thực thi file .cpanel.yml (tự chạy npm install & reload bot trên hosting)
          echo "⚙️ [2/2] Yêu cầu cPanel thực thi .cpanel.yml (Tự chạy npm install và reload bot trên server)..."
          DEPLOY_RES=$(curl -s -k -H "Authorization: cpanel $CPANEL_USER:$API_TOKEN" \
            "https://$CPANEL_HOST:2083/execute/VersionControlDeployment/create?repository_root=$REPO_PATH")

          echo "Phản hồi từ cPanel Deploy:"
          echo "$DEPLOY_RES"

          # Kiểm tra kết quả
          if echo "$DEPLOY_RES" | grep -q '"status":1'; then
            echo "🎉 [CI/CD] THÀNH CÔNG 100%: cPanel đã tự kéo code và tự chạy 'npm install' trên hosting thành công!"
          else
            echo "⚠️ cPanel đã nhận lệnh, vui lòng kiểm tra phản hồi ở trên."
          fi
