name: CD - cPanel Auto Deploy (Native npm install on server)

on:
  push:
    branches:
      - main
      - test/cd-deploy
  workflow_dispatch:

jobs:
  deploy_cpanel:
    name: 🚀 Full CI/CD Deployment Pipeline
    runs-on: ubuntu-latest

    env:
      CPANEL_HOST: ${{ secrets.CPANEL_HOST || secrets.CPANEL_SSH_HOST || 'gienphim.site' }}
      CPANEL_USER: ${{ secrets.CPANEL_USERNAME || secrets.CPANEL_SSH_USER || 'rccwxhmh' }}
      API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
      REPO_PATH: ${{ secrets.CPANEL_REPO_PATH || secrets.CPANEL_APP_PATH || '/home/rccwxhmh/discord/hoangnek_bot_discord' }}
      BRANCH: ${{ github.ref_name }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: 📦 Install Dependencies (CI Check)
        run: npm ci

      - name: 🧪 Run Tests & Syntax Validation
        run: npm test

      - name: 🔐 Validate cPanel API Token Configuration
        run: |
          if [ -z "$API_TOKEN" ]; then
            echo "❌ LỖI: Chưa cấu hình CPANEL_API_TOKEN trong GitHub Secrets!"
            exit 1
          fi
          echo "✅ API Token đã được cấu hình sẵn sàng."
          echo "🌐 Host: $CPANEL_HOST:2083"
          echo "📁 Thư mục cPanel: $REPO_PATH"
          echo "🌿 Nhánh triển khai: $BRANCH"

      - name: 📥 [1/3] Pull Latest Code to cPanel (Git Update)
        run: |
          echo "🚀 Đang yêu cầu cPanel kéo code mới nhất từ GitHub..."
          UPDATE_RES=$(curl -s -k -G \
            -H "Authorization: cpanel $CPANEL_USER:$API_TOKEN" \
            "https://$CPANEL_HOST:2083/execute/VersionControl/update" \
            --data-urlencode "repository_root=$REPO_PATH" \
            --data-urlencode "branch=$BRANCH")
          
          echo "Phản hồi từ cPanel Update:"
          echo "$UPDATE_RES"

          if echo "$UPDATE_RES" | grep -q '"status":0'; then
            echo "❌ Lỗi cập nhật Git trên cPanel!"
            exit 1
          fi
          echo "✅ cPanel đã kéo code thành công."

      - name: ⚙️ [2/3] Execute .cpanel.yml (Native npm install on server)
        run: |
          echo "📦 Đang kích hoạt cPanel chạy file .cpanel.yml để tự động tải thư viện npm..."
          DEPLOY_RES=$(curl -s -k -G \
            -H "Authorization: cpanel $CPANEL_USER:$API_TOKEN" \
            "https://$CPANEL_HOST:2083/execute/VersionControlDeployment/create" \
            --data-urlencode "repository_root=$REPO_PATH")

          echo "Phản hồi từ cPanel Deploy:"
          echo "$DEPLOY_RES"

          if echo "$DEPLOY_RES" | grep -q '"status":0'; then
            echo "❌ Lỗi khi thực thi .cpanel.yml trên cPanel!"
            exit 1
          fi
          echo "✅ cPanel đã thực thi .cpanel.yml và chạy npm install thành công."

      - name: 🔄 [3/3] Verify Application Reload Status
        run: |
          echo "🔄 Ứng dụng bot đang được Phusion Passenger tải lại với code và thư viện mới."

      - name: 🎉 Deployment Completed
        run: |
          echo "🎉 [CI/CD] HOÀN TẤT TRIỂN KHAI 100%!"
          echo "✅ Mã nguồn đã cập nhật."
          echo "✅ Thư viện node_modules đã được cài trực tiếp trên hosting."
          echo "✅ Bot Discord đã được khởi động lại thành công."
