name: CD - Auto Deploy to cPanel (100% Automated)

on:
  push:
    branches:
      - main
      - test/cd-deploy
  workflow_dispatch:

jobs:
  # Bước 1: Kiểm thử cú pháp và chất lượng mã nguồn
  ci_verification:
    name: 🧪 Verify CI Checks
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Run Tests & Syntax Validation
        run: npm test

  # Bước 2: Tự động đưa toàn bộ mã nguồn vào thư mục cPanel
  deploy_to_cpanel:
    name: 🚀 100% Auto-Deploy to cPanel
    needs: ci_verification
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🔄 Create Restart Trigger for cPanel (Phusion Passenger)
        run: |
          mkdir -p tmp
          touch tmp/restart.txt

      - name: 🌐 Deploy Code Directly to cPanel Folder
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || secrets.CPANEL_SSH_HOST || 'gienphim.site' }}
          username: ${{ secrets.FTP_USERNAME || secrets.CPANEL_SSH_USER || 'rccwxhmh' }}
          password: ${{ secrets.FTP_PASSWORD || secrets.CPANEL_SSH_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          server-dir: 'discord/hoangnek_bot_discord/'
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            .env.development
            .env.production
            .env.local
            .env.*.local
            .github/**
            docs/**
            *.log
            logs/**

      - name: 📡 Trigger cPanel UAPI Deployment (If API Token exists)
        run: |
          CPANEL_HOST="${{ secrets.CPANEL_HOST || secrets.CPANEL_SSH_HOST || 'gienphim.site' }}"
          CPANEL_USER="${{ secrets.CPANEL_USERNAME || secrets.CPANEL_SSH_USER || 'rccwxhmh' }}"
          API_TOKEN="${{ secrets.CPANEL_API_TOKEN }}"
          APP_PATH="/home/rccwxhmh/discord/hoangnek_bot_discord"
          BRANCH="${{ github.ref_name }}"

          if [ -n "$API_TOKEN" ]; then
            echo "🚀 Đang kích hoạt cPanel UAPI deploy..."
            curl -s -k -H "Authorization: cpanel $CPANEL_USER:$API_TOKEN" \
              "https://$CPANEL_HOST:2083/execute/VersionControl/update?repository_root=$APP_PATH&branch=$BRANCH" || true
            curl -s -k -H "Authorization: cpanel $CPANEL_USER:$API_TOKEN" \
              "https://$CPANEL_HOST:2083/execute/VersionControlDeployment/create?repository_root=$APP_PATH" || true
          fi

      - name: 🎉 Deployment Completed
        run: echo "✅ [CI/CD] Đã tự động cập nhật toàn bộ file code vào thư mục discord/hoangnek_bot_discord và kích hoạt reload bot thành công 100%!"
