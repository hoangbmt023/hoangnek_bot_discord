name: CD - Deploy to cPanel via FTP (Production)

on:
  push:
    branches:
      - main
      - test/cd-deploy # Kích hoạt CD test ngay khi push lên nhánh này
  workflow_dispatch: # Cho phép bấm nút "Run workflow" để test deploy thủ công bất cứ lúc nào

jobs:
  # Bước 1: Kiểm thử cú pháp & chất lượng code trước khi deploy
  ci_verification:
    name: 🧪 Verify CI on Trigger Branch
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Run Tests & Syntax Validation
        run: npm test

  # Bước 2: Tự động Deploy lên cPanel qua FTP (Không cần quyền SSH)
  deploy_cpanel_ftp:
    name: 🚀 Deploy to cPanel via FTP
    needs: ci_verification
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Đồng bộ thông minh chỉ tải các file có thay đổi

      - name: 🔄 Create Restart Trigger for cPanel (Phusion Passenger)
        run: |
          mkdir -p tmp
          touch tmp/restart.txt

      - name: 🌐 Sync Files to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'hoangnek_bot_discord/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            .env.development
            .env.production
            .env.local
            .env.*.local
            .github/**
            docs/**
            README.md
            *.log
            logs/**

      - name: 📢 Deployment Status
        run: echo "✅ [CI/CD] Đã triển khai và đồng bộ code lên cPanel qua FTP thành công!"
