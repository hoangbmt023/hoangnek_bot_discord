name: CD - Deploy to cPanel Linux (Production)

on:
  push:
    branches:
      - main
      - test/cd-deploy # Kích hoạt CD test ngay khi push lên nhánh này
  workflow_dispatch: # Cho phép bấm nút "Run workflow" để test deploy thủ công bất cứ lúc nào

jobs:
  # Bước 1: Chạy kiểm tra CI trước khi deploy
  ci_verification:
    name: 🧪 Verify CI on Trigger Branch
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Run Tests & Syntax Validation
        run: npm test

  # Bước 2: Tự động kết nối SSH Key và Deploy lên cPanel Linux
  deploy_cpanel:
    name: 🚀 Deploy to cPanel via SSH Key
    needs: ci_verification
    runs-on: ubuntu-latest

    steps:
      - name: 🌐 Execute Remote SSH Commands on cPanel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          password: ${{ secrets.CPANEL_SSH_PASSWORD }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          script: |
            echo "🚀 [CI/CD] Bắt đầu triển khai code mới lên cPanel qua SSH..."
            
            # 1. Xác định thư mục chứa code bot trên cPanel
            APP_DIR="${{ secrets.CPANEL_APP_PATH }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="$HOME/hoangnek_bot_discord"
            fi
            
            echo "📁 Thư mục dự án: $APP_DIR"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR" || exit 1

            # Khắc phục lỗi quyền sở hữu Git an toàn trên Linux
            git config --global --add safe.directory "$APP_DIR" 2>/dev/null || true

            # 2. Đồng bộ code mới nhất từ nhánh kích hoạt
            BRANCH="${{ github.ref_name }}"
            if [ -d ".git" ]; then
              echo "📥 Đang cập nhật mã nguồn mới nhất từ branch: $BRANCH..."
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
            else
              echo "📥 Clone mã nguồn từ GitHub lần đầu..."
              git clone -b "$BRANCH" "https://github.com/${{ github.repository }}.git" .
            fi

            # 3. Cài đặt các thư viện mới (bỏ qua devDependencies)
            echo "📦 Cài đặt & cập nhật dependencies (npm install)..."
            npm install --omit=dev

            # 4. Tải lại ứng dụng trên cPanel (Phusion Passenger Reload)
            echo "🔄 Khởi động lại Bot trên cPanel..."
            mkdir -p tmp
            touch tmp/restart.txt

            # Nếu máy chủ dùng PM2 để quản lý process
            if command -v pm2 &> /dev/null; then
              pm2 restart hoangnek-bot 2>/dev/null || pm2 restart all 2>/dev/null || true
            fi

            echo "✅ [CI/CD] Triển khai thành công lên Production Server!"
