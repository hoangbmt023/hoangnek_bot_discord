name: CD - Auto Deploy to cPanel Linux (100% Automated)

on:
  push:
    branches:
      - main
      - test/cd-deploy
  workflow_dispatch:

jobs:
  # Bước 1: Chạy kiểm thử an toàn
  ci_verification:
    name: 🧪 Verify CI Checks
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Run Tests & Syntax Validation
        run: npm test

  # Bước 2: Tự động kết nối SSH và Deploy 100% lên cPanel
  deploy_cpanel_ssh:
    name: 🚀 100% Auto-Deploy to cPanel
    needs: ci_verification
    runs-on: ubuntu-latest

    steps:
      - name: 🌐 Connect SSH and Execute Full Auto-Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          password: ${{ secrets.CPANEL_SSH_PASSWORD }}
          port: ${{ secrets.CPANEL_SSH_PORT || 15149 }}
          script: |
            echo "🚀 [CI/CD] Bắt đầu tự động cập nhật code mới lên cPanel..."
            
            # 1. Đi vào đúng thư mục dự án trên cPanel
            APP_DIR="${{ secrets.CPANEL_APP_PATH }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="$HOME/discord/hoangnek_bot_discord"
            fi
            
            echo "📁 Thư mục dự án: $APP_DIR"
            cd "$APP_DIR" || exit 1

            # Khắc phục lỗi an toàn Git trên Linux
            git config --global --add safe.directory "$APP_DIR" 2>/dev/null || true

            # 2. Đồng bộ code mới nhất từ GitHub
            BRANCH="${{ github.ref_name }}"
            echo "📥 Kéo mã nguồn mới nhất từ branch: $BRANCH..."
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"

            # 3. Cài đặt các thư viện mới (nếu có)
            echo "📦 Cập nhật dependencies (npm install)..."
            npm install --omit=dev

            # 4. Kích hoạt cPanel khởi động lại Bot (Phusion Passenger Reload)
            echo "🔄 Khởi động lại Bot trên cPanel..."
            mkdir -p tmp
            touch tmp/restart.txt

            # Nếu dùng PM2
            if command -v pm2 &> /dev/null; then
              pm2 restart hoangnek-bot 2>/dev/null || pm2 restart all 2>/dev/null || true
            fi

            echo "🎉 [CI/CD] HOÀN TẤT TỰ ĐỘNG: Code đã lên Production và Bot đã được reload!"
