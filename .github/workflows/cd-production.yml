name: CD - Auto Deploy to cPanel via FTP (100% Automated)

on:
  push:
    branches:
      - main
      - test/cd-deploy
  workflow_dispatch:

jobs:
  # Bước 1: Chạy kiểm thử chất lượng code
  ci_verification:
    name: 🧪 Verify CI Checks
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: 📦 Install Dependencies (All)
        run: npm ci

      - name: 🧪 Run Tests & Syntax Validation
        run: npm test

  # Bước 2: Tự động Build Packages & Deploy 100% qua FTP (Bao gồm cả thư viện mới)
  deploy_cpanel_ftp:
    name: 🚀 100% Auto-Deploy with Dependencies
    needs: ci_verification
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: 📦 Build Production Dependencies on Linux
        run: |
          echo "📦 Đang cài đặt thư viện cho Production..."
          npm ci --omit=dev

      - name: 🔄 Create Restart Trigger for cPanel (Phusion Passenger)
        run: |
          mkdir -p tmp
          touch tmp/restart.txt

      - name: 🌐 Sync Files & Dependencies to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.FTP_USERNAME || secrets.CPANEL_SSH_USER }}
          password: ${{ secrets.FTP_PASSWORD || secrets.CPANEL_SSH_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'discord/hoangnek_bot_discord/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .env
            .env.development
            .env.production
            .env.local
            .env.*.local
            .github/**
            docs/**
            README.md
            *.log
            logs/**

      - name: 🎉 Deployment Completed
        run: echo "✅ [CI/CD] Đã tự động cập nhật code, cài đặt thư viện mới và khởi động lại Bot trên cPanel thành công 100%!"
