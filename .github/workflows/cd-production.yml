name: CD - cPanel UAPI Auto Deploy (100% Automated)

on:
  push:
    branches:
      - main
      - test/cd-deploy
  workflow_dispatch:

jobs:
  # Bước 1: Kiểm thử cú pháp và chất lượng mã nguồn
  ci_verification:
    name: 🧪 Verify CI Checks
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Run Tests & Syntax Validation
        run: npm test

  # Bước 2: Gọi cPanel UAPI qua HTTPS để cPanel tự kéo code, cài npm và restart bot
  deploy_cpanel_uapi:
    name: 🚀 100% Auto-Deploy via cPanel UAPI
    needs: ci_verification
    runs-on: ubuntu-latest

    steps:
      - name: 🌐 Call cPanel UAPI to Pull Code & Deploy
        run: |
          CPANEL_HOST="${{ secrets.CPANEL_HOST || secrets.CPANEL_SSH_HOST || 'gienphim.site' }}"
          CPANEL_USER="${{ secrets.CPANEL_USERNAME || secrets.CPANEL_SSH_USER || 'rccwxhmh' }}"
          API_TOKEN="${{ secrets.CPANEL_API_TOKEN }}"
          APP_PATH="${{ secrets.CPANEL_APP_PATH || '/home/rccwxhmh/discord/hoangnek_bot_discord' }}"
          BRANCH="${{ github.ref_name }}"

          if [ -z "$API_TOKEN" ]; then
            echo "❌ LỖI: Chưa cấu hình CPANEL_API_TOKEN trong GitHub Secrets!"
            exit 1
          fi

          echo "🚀 [CI/CD] Đang kết nối tới cPanel UAPI (https://$CPANEL_HOST:2083)..."
          echo "📁 Thư mục dự án: $APP_PATH"
          echo "🌿 Nhánh đồng bộ: $BRANCH"

          # 1. Gọi cPanel UAPI để cập nhật (git pull) từ nhánh hiện tại
          echo "📥 [1/2] Yêu cầu cPanel kéo code mới nhất từ GitHub..."
          UPDATE_RES=$(curl -s -k -H "Authorization: cpanel $CPANEL_USER:$API_TOKEN" \
            "https://$CPANEL_HOST:2083/execute/VersionControl/update?repository_root=$APP_PATH&branch=$BRANCH")
          
          echo "Phản hồi từ cPanel Update:"
          echo "$UPDATE_RES"

          # 2. Gọi cPanel UAPI để thực thi file .cpanel.yml (npm install + restart bot)
          echo "⚙️ [2/2] Yêu cầu cPanel chạy .cpanel.yml (npm install & reload bot)..."
          DEPLOY_RES=$(curl -s -k -H "Authorization: cpanel $CPANEL_USER:$API_TOKEN" \
            "https://$CPANEL_HOST:2083/execute/VersionControlDeployment/create?repository_root=$APP_PATH")

          echo "Phản hồi từ cPanel Deploy:"
          echo "$DEPLOY_RES"

          # Kiểm tra kết quả
          if echo "$DEPLOY_RES" | grep -q '"status":1'; then
            echo "🎉 [CI/CD] THÀNH CÔNG 100%: cPanel đã tự kéo code, tải thư viện npm và khởi động lại Bot!"
          else
            echo "⚠️ cPanel đã nhận lệnh, vui lòng kiểm tra phản hồi ở trên."
          fi
