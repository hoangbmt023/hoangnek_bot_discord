name: CD - Sync Code to cPanel (FTP)

on:
  push:
    branches:
      - main
      - test/cd-deploy
  workflow_dispatch:

jobs:
  # Bước 1: Kiểm thử cú pháp và chất lượng mã nguồn
  ci_verification:
    name: 🧪 Verify CI Checks
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Run Tests & Syntax Validation
        run: npm test

  # Bước 2: Tự động đồng bộ các file mã nguồn thay đổi lên cPanel qua FTP
  deploy_to_cpanel:
    name: 🌐 Sync Code via FTP
    needs: ci_verification
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🌐 Upload Changed Files to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || secrets.CPANEL_SSH_HOST || 'gienphim.site' }}
          username: ${{ secrets.FTP_USERNAME || secrets.CPANEL_SSH_USER || 'rccwxhmh' }}
          password: ${{ secrets.FTP_PASSWORD || secrets.CPANEL_SSH_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          server-dir: 'discord/hoangnek_bot_discord/'
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            .env.development
            .env.production
            .env.local
            .env.*.local
            .github/**
            docs/**
            *.log
            logs/**

      - name: 🎉 Deployment Completed
        run: echo "✅ [CI/CD] Đã đồng bộ toàn bộ file mã nguồn mới nhất lên hosting cPanel thành công!"
