name: CD - Trigger cPanel Git Deploy Webhook

on:
  push:
    branches:
      - main
      - test/cd-deploy
  workflow_dispatch: # Cho phép bấm nút "Run workflow" để deploy thủ công bất cứ lúc nào

jobs:
  # Bước 1: Kiểm thử an toàn trước khi kích hoạt cPanel
  ci_verification:
    name: 🧪 Verify CI on Trigger Branch
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Run Tests & Syntax Validation
        run: npm test

  # Bước 2: Kích hoạt Webhook Deploy của cPanel Git Version Control
  trigger_cpanel_deploy:
    name: 🚀 Trigger cPanel Git Auto-Deploy
    needs: ci_verification
    runs-on: ubuntu-latest

    steps:
      - name: 🌐 Send Deploy Signal to cPanel Webhook
        run: |
          if [ -z "${{ secrets.CPANEL_DEPLOY_WEBHOOK_URL }}" ]; then
            echo "⚠️ Chưa cấu hình CPANEL_DEPLOY_WEBHOOK_URL trong GitHub Secrets."
            echo "👉 Vui lòng xem hướng dẫn trong docs/CICD_GUIDE.md để lấy Webhook URL từ cPanel Git Version Control."
          else
            echo "🚀 Đang gửi yêu cầu kích hoạt Deploy đến cPanel Git Version Control..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET "${{ secrets.CPANEL_DEPLOY_WEBHOOK_URL }}")
            echo "$RESPONSE"
            echo "✅ cPanel đã nhận lệnh: Đang kéo code mới, chạy npm install và khởi động lại Bot!"
          fi
